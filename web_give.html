<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Birthday Gift</title>
    <link rel="stylesheet" href="web_give.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
</head>
<body>

    <div class="screen-container active" id="loading-screen">
        <h1 class="loading-text">BIRTHDAY GIFT</h1>
        <div class="progress-bar">
            <div class="progress"></div>
        </div>
        <div class="progress-percent">0%</div>
    </div>

    <div class="screen-container" id="main-menu">
        <div class="gameboy">
            <div class="gameboy-top">
                <span class="power-led"></span>
                <span class="power-text">POWER</span>
                <span class="game-boy-text">GAME-BOY</span>
            </div>
            <div class="gameboy-screen">
                <div class="screen-content">
                    <h1>Happy Birthday!</h1>
                    <p>Press Start Button!</p>
                </div>
            </div>
            <div class="gameboy-buttons">
                <div class="button-row">
                    <button class="menu-btn" id="message-btn" data-target="message-screen">MESSAGE</button>
                    <button class="menu-btn" id="gallery-btn" data-target="gallery-screen">GALLERY</button>
                </div>
                <div class="button-row">
                    <button class="menu-btn" id="music-btn" data-target="music-screen">MUSIC</button>
                    <button class="menu-btn" id="tetris-btn" data-target="tetris-screen">TETRIS</button>
                </div>
                <div class="controls">
                    <div class="d-pad">
                        <div class="d-pad-vertical">
                            <button class="d-pad-btn up"></button>
                            <button class="d-pad-btn down"></button>
                        </div>
                        <div class="d-pad-horizontal">
                            <button class="d-pad-btn left"></button>
                            <button class="d-pad-btn right"></button>
                        </div>
                    </div>
                    <div class="action-buttons">
                        <button class="action-btn a">A</button>
                        <button class="action-btn b">B</button>
                    </div>
                </div>
                <div class="start-select">
                    <button class="select-btn">SELECT</button>
                    <button class="start-btn">START</button>
                </div>
            </div>
        </div>
    </div>

    <div class="screen-container" id="message-screen">
        <div class="gameboy">
            <div class="gameboy-screen">
                <div class="screen-content message-content">
                    <h2 class="message-title">Message</h2>
                    <div class="message-text"></div>
                    <button class="skip-btn" id="skip-message">SKIP</button>
                </div>
            </div>
            <div class="gameboy-buttons">
                <div class="navigation-buttons">
                    <button class="nav-btn" data-target="main-menu">KEMBALI</button>
                    <button class="nav-btn next-message" id="next-message">SELANJUTNYA</button>
                </div>
            </div>
        </div>
    </div>

    <div class="screen-container" id="gallery-screen">
        <div class="gameboy">
            <div class="gameboy-screen">
                <div class="screen-content gallery-content">
                    <h2 class="gallery-title">Gallery</h2>
                    <div class="gallery-image-container">
                        <img src="" alt="Gallery Image" id="gallery-img">
                        <div class="image-label"></div>
                    </div>
                    <div class="gallery-info">
                        <span class="info-text">Captured <span id="captured-count">1</span>/8</span>
                    </div>
                </div>
            </div>
            <div class="gameboy-buttons">
                <div class="navigation-buttons">
                    <button class="nav-btn" data-target="main-menu">KEMBALI</button>
                    <button class="nav-btn next-image">SELANJUTNYA</button>
                </div>
            </div>
        </div>
    </div>
    
    <div class="screen-container" id="music-screen">
        <div class="gameboy">
            <div class="gameboy-screen">
                <div class="screen-content music-content">
                    <h2 class="music-title">Music Player</h2>
                    <div class="spotify-logo">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/19/Spotify_logo_without_text.svg/2048px-Spotify_logo_without_text.svg.png" alt="Spotify Logo"> Spotify Playlists
                    </div>
                    <div class="playlist-container">
                        </div>
                    <div class="now-playing-info">
                        <p>Now Playing: <span id="now-playing-text"></span></p>
                    </div>
                </div>
            </div>
            <div class="gameboy-buttons">
                <div class="navigation-buttons">
                    <button class="nav-btn" data-target="main-menu">KEMBALI</button>
                    <button class="nav-btn" data-target="tetris-screen">SELANJUTNYA</button>
                </div>
            </div>
        </div>
    </div>

    <div class="screen-container" id="tetris-screen">
        <div class="gameboy">
            <div class="gameboy-screen">
                <div class="screen-content tetris-content">
                    <h2 class="tetris-title">Tetris</h2>
                    <canvas id="tetris-board"></canvas>
                    <div class="tetris-info">
                        <span id="score">Score: 0</span> | <span id="level">Level: 1</span> | <span id="lines">Lines: 0</span>
                    </div>
                </div>
            </div>
            <div class="gameboy-buttons">
                <div class="tetris-controls">
                    <button class="nav-btn" id="tetris-back" data-target="main-menu">KEMBALI</button>
                    <button class="tetris-rotate">ROTATE</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="web_give.js"></script>
</body>
</html>
